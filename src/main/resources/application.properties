gg.jte.development-mode=true
spring.application.name=webportfolio

# Azure SQL Database Connection Properties
spring.datasource.url=${AZURE_DATABASE_URL}
spring.datasource.username=${AZURE_DATABASE_USERNAME}
spring.datasource.password=${AZURE_DATABASE_PASSWORD}
spring.datasource.driverClassName=com.microsoft.sqlserver.jdbc.SQLServerDriver
spring.jpa.hibernate.ddl-auto=update
spring.jpa.database-platform=org.hibernate.dialect.SQLServerDialect

#telnyx properties
telnyx.api-key=${TELNYX_API_KEY}
telnyx.from-number=${TELNYX_FROM_NUMBER}

# Public SMS program identity. Override these values in Render when needed.
app.messaging.brand-name=${SMS_BRAND_NAME:Freddy's Gift Exchange}
app.messaging.support-email=${SMS_SUPPORT_EMAIL:support@freddymcode.com}
app.messaging.website-url=${SMS_WEBSITE_URL:https://www.freddymcode.com}
